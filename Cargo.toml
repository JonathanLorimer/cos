[package]
name = "cos"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
minijinja = { version = "3.1.0", features = ["json", "serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
rusqlite_migration = "2.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "trace", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
