{% extends "base.html" %}
{% block title %}Mentions{% endblock %}
{% block content %}
<h2 class="text-lg font-semibold mb-4">Mentions</h2>

<details class="mb-4 rounded-lg border border-slate-200 bg-white">
  <summary class="cursor-pointer px-4 py-2 text-sm font-medium text-slate-600">Add manually</summary>
  <form class="px-4 pb-4 grid grid-cols-2 gap-3 items-center"
        hx-post="/mentions" hx-target="#mentions-table tbody" hx-swap="afterbegin">
    <input name="from_user" placeholder="priya" required class="border border-slate-300 rounded px-2 py-1 text-sm" />
    <label class="flex items-center gap-2 text-sm text-slate-600">
      <input type="checkbox" name="needs_response" /> needs response
    </label>
    <input name="text" placeholder="can you take a look at..." required class="col-span-2 border border-slate-300 rounded px-2 py-1 text-sm" />
    <button class="bg-slate-900 text-white text-sm rounded px-3 py-1.5 w-fit">Add</button>
  </form>
</details>

<div data-island="filter" data-table="mentions-table"></div>

<div class="rounded-lg border border-slate-200 bg-white overflow-hidden">
  <table id="mentions-table" class="w-full">
    <thead class="bg-slate-50 text-left text-xs font-semibold text-slate-500 uppercase tracking-wide">
      <tr>
        <th class="py-2 px-3">From</th>
        <th class="py-2 px-3">Message</th>
        <th class="py-2 px-3">When</th>
        <th class="py-2 px-3">Status</th>
        <th class="py-2 px-3"></th>
      </tr>
    </thead>
    <tbody>
      {% for item in items %}{% include "partials/mention_row.html" %}{% else %}
      <tr><td colspan="5" class="py-6 px-3 text-sm text-slate-400 text-center">No mentions captured yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>

<script src="/static/islands/filter.js"></script>
{% endblock %}
