<tr id="cm-row-{{ item.id }}" class="border-b border-slate-100 last:border-0"
    data-search="{{ item.text }} {{ item.due_date }} {{ item.status }}">
  <td class="py-2 px-3 text-sm align-top">{{ item.text }}</td>
  <td class="py-2 px-3 text-sm align-top text-slate-500">{{ item.due_date }}</td>
  <td class="py-2 px-3 text-sm align-top">
    <span class="inline-block rounded px-2 py-0.5 text-xs
      {% if item.status == 'done' %}bg-green-100 text-green-700{% else %}bg-blue-100 text-blue-700{% endif %}">{{ item.status }}</span>
  </td>
  <td class="py-2 px-3 text-sm align-top text-right whitespace-nowrap">
    <button class="text-xs text-slate-500 hover:text-slate-900 mr-3"
      hx-patch="/commitments/{{ item.id }}/resolve" hx-target="#cm-row-{{ item.id }}" hx-swap="outerHTML">Done</button>
    <button class="text-xs text-red-500 hover:text-red-700"
      hx-delete="/commitments/{{ item.id }}" hx-target="#cm-row-{{ item.id }}" hx-swap="outerHTML" hx-confirm="Delete this commitment?">Delete</button>
  </td>
</tr>
