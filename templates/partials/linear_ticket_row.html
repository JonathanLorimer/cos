<tr id="lt-row-{{ item.identifier }}" class="border-b border-slate-100 last:border-0"
    data-search="{{ item.identifier }} {{ item.title }} {{ item.state }} {{ item.relationship }}">
  <td class="py-2 px-3 text-sm align-top font-mono text-xs text-slate-500">{{ item.identifier }}</td>
  <td class="py-2 px-3 text-sm align-top">
    {{ item.title }}
    {% if item.linked_github_url %}
    <div class="text-xs"><a href="{{ item.linked_github_url }}" target="_blank" rel="noopener" class="text-blue-600 hover:underline">linked PR</a></div>
    {% endif %}
  </td>
  <td class="py-2 px-3 text-sm align-top">{{ item.relationship }}</td>
  <td class="py-2 px-3 text-sm align-top">
    <span class="inline-block rounded px-2 py-0.5 text-xs
      {% if item.state == 'Done' %}bg-green-100 text-green-700
      {% elif item.state == 'In Review' %}bg-amber-100 text-amber-700
      {% elif item.state == 'In Progress' %}bg-blue-100 text-blue-700
      {% else %}bg-slate-100 text-slate-500{% endif %}">{{ item.state }}</span>
  </td>
  <td class="py-2 px-3 text-sm align-top text-right whitespace-nowrap">
    <button class="text-xs text-slate-500 hover:text-slate-900 mr-3"
      hx-patch="/linear-tickets/{{ item.identifier }}/resolve" hx-target="#lt-row-{{ item.identifier }}" hx-swap="outerHTML">Mark done</button>
    <button class="text-xs text-red-500 hover:text-red-700"
      hx-delete="/linear-tickets/{{ item.identifier }}" hx-target="#lt-row-{{ item.identifier }}" hx-swap="outerHTML" hx-confirm="Delete this ticket?">Delete</button>
  </td>
</tr>
