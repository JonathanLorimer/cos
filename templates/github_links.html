{% extends "base.html" %}
{% block title %}GitHub Links{% endblock %}
{% block content %}
<h2 class="text-lg font-semibold mb-4">GitHub Links</h2>

<details class="mb-4 rounded-lg border border-slate-200 bg-white">
  <summary class="cursor-pointer px-4 py-2 text-sm font-medium text-slate-600">Add manually</summary>
  <form class="px-4 pb-4 grid grid-cols-2 gap-3"
        hx-post="/github-links" hx-target="#github-links-table tbody" hx-swap="afterbegin">
    <input name="url" placeholder="https://github.com/org/repo/pull/1" required class="col-span-2 border border-slate-300 rounded px-2 py-1 text-sm" />
    <input name="repo" placeholder="org/repo" required class="border border-slate-300 rounded px-2 py-1 text-sm" />
    <select name="relationship" class="border border-slate-300 rounded px-2 py-1 text-sm">
      <option value="authored">authored</option>
      <option value="reviewing">reviewing</option>
      <option value="mentioned">mentioned</option>
    </select>
    <input name="context" placeholder="context / note" class="col-span-2 border border-slate-300 rounded px-2 py-1 text-sm" />
    <button class="col-span-2 bg-slate-900 text-white text-sm rounded px-3 py-1.5 w-fit">Add</button>
  </form>
</details>

<div data-island="filter" data-table="github-links-table"></div>

<div class="rounded-lg border border-slate-200 bg-white overflow-hidden">
  <table id="github-links-table" class="w-full">
    <thead class="bg-slate-50 text-left text-xs font-semibold text-slate-500 uppercase tracking-wide">
      <tr>
        <th class="py-2 px-3">Repo</th>
        <th class="py-2 px-3">Relationship</th>
        <th class="py-2 px-3">Status</th>
        <th class="py-2 px-3">Synced</th>
        <th class="py-2 px-3"></th>
      </tr>
    </thead>
    <tbody>
      {% for item in items %}{% include "partials/github_link_row.html" %}{% else %}
      <tr><td colspan="5" class="py-6 px-3 text-sm text-slate-400 text-center">No GitHub links tracked yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>

<script src="/static/islands/filter.js"></script>
{% endblock %}
