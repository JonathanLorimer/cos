{% extends "base.html" %}
{% block title %}Commitments{% endblock %}
{% block content %}
<h2 class="text-lg font-semibold mb-4">Commitments</h2>

<details class="mb-4 rounded-lg border border-slate-200 bg-white">
  <summary class="cursor-pointer px-4 py-2 text-sm font-medium text-slate-600">Add manually</summary>
  <form class="px-4 pb-4 grid grid-cols-2 gap-3"
        hx-post="/commitments" hx-target="#commitments-table tbody" hx-swap="afterbegin">
    <input name="text" placeholder="I'll ship the fix" required class="col-span-2 border border-slate-300 rounded px-2 py-1 text-sm" />
    <input name="due_date" placeholder="Friday" required class="border border-slate-300 rounded px-2 py-1 text-sm" />
    <button class="bg-slate-900 text-white text-sm rounded px-3 py-1.5 w-fit">Add</button>
  </form>
</details>

<div data-island="filter" data-table="commitments-table"></div>

<div class="rounded-lg border border-slate-200 bg-white overflow-hidden">
  <table id="commitments-table" class="w-full">
    <thead class="bg-slate-50 text-left text-xs font-semibold text-slate-500 uppercase tracking-wide">
      <tr>
        <th class="py-2 px-3">Commitment</th>
        <th class="py-2 px-3">Due</th>
        <th class="py-2 px-3">Status</th>
        <th class="py-2 px-3"></th>
      </tr>
    </thead>
    <tbody>
      {% for item in items %}{% include "partials/commitment_row.html" %}{% else %}
      <tr><td colspan="4" class="py-6 px-3 text-sm text-slate-400 text-center">No commitments logged yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>

<script src="/static/islands/filter.js"></script>
{% endblock %}
